name: Release

on:
  push:
    branches: master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Polars can use substantial memory, particularly on the macOS ARM64 runner.
  CARGO_BUILD_JOBS: '1'

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Determine release tag
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'parquet-editor'
          if (-not $package) { throw 'parquet-editor package not found' }
          $tag = "v$($package.version)-main.$env:GITHUB_RUN_NUMBER.$($env:GITHUB_SHA.Substring(0, 7))"
          "tag=$tag" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libx11-dev libxcb1-dev
      - name: Run tests and build release binary
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --release --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo build --locked --release --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Smoke test binary
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = if ($env:BUILD_TARGET -like '*windows*') { '.exe' } else { '' }
          & "./target/$env:BUILD_TARGET/release/parquet-editor$suffix" --version
          if ($LASTEXITCODE -ne 0) { throw 'Binary smoke test failed' }
      - name: Package binary
        run: ./.github/scripts/package-release.ps1 -Target $env:BUILD_TARGET -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: ./.github/scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -Commit $env:GITHUB_SHA
